paths:

  /api/loggerTest:
    get:
      tags:
        - Logger
      summary: Probar niveles de logging
      description: Ejecuta una prueba de los diferentes niveles del sistema de logging de ShipNow. Este endpoint se utiliza como herramienta de validacion del logger y no representa una funcionalidad de negocio.

      responses:
        "200":
          description: Prueba del logger ejecutada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Logger funcionando correctamente
              example:
                status: success
                message: Logger funcionando correctamente

        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor