paths:

  /api/orders:
    get:
      tags:
        - Orders
      summary: Obtener todos los pedidos
      description: Devuelve los pedidos registrados en ShipNow mediante paginacion. Por defecto utiliza page=1 y limit=10. El limite efectivo maximo es 50.
      parameters:
        - name: page
          in: query
          required: false
          description: Numero de pagina. Debe ser un entero mayor a 0.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Cantidad de resultados por pagina. Debe ser un entero mayor a 0. Los valores superiores a 50 se ajustan automaticamente a 50.
          schema:
            type: integer
            minimum: 1
            default: 10
          example: 10
      responses:
        "200":
          description: Lista paginada de pedidos obtenida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
              example:
                status: success
                payload:
                  - _id: "68b123456789abcdef654321"
                    customer:
                      _id: "68b123456789abcdef111111"
                      firstName: "Ivan"
                      lastName: "Sanchez"
                      email: "ivan@example.com"
                      role: customer
                    items:
                      - name: "Notebook Lenovo"
                        quantity: 2
                        price: 850000
                    deliveryAddress: "Av. Independencia 1234, Mar del Plata"
                    total: 1700000
                    status: created
                    priority: normal
                    proof:
                      originalName: "comprobante-entrega.pdf"
                      filename: "uuid-comprobante.pdf"
                      path: "/uploads/proofs/uuid-comprobante.pdf"
                      mimetype: application/pdf
                      size: 245760
                      uploadedAt: "2026-09-28T15:00:00.000Z"
                    createdAt: "2026-09-28T15:00:00.000Z"
                    updatedAt: "2026-09-28T15:00:00.000Z"
                pagination:
                  page: 1
                  limit: 10
                  total: 35
                  totalPages: 4
                  hasPrevPage: false
                  hasNextPage: true
        "400":
          description: Parametros de paginacion invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: VALIDATION_ERROR
                message: El parametro page debe ser un numero entero mayor a 0
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

    post:
      tags:
        - Orders
      summary: Crear un pedido
      description: Crea un nuevo pedido en ShipNow. El estado inicial se establece automaticamente como created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
            example:
              customer: "68b123456789abcdef111111"
              items:
                - name: "Notebook Lenovo"
                  quantity: 2
                  price: 850000
              deliveryAddress: "Av. Independencia 1234, Mar del Plata"
              total: 1700000
              priority: normal
      responses:
        "201":
          description: Pedido creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSuccessResponse"
              example:
                status: success
                message: Pedido creado correctamente
                payload:
                  _id: "68b123456789abcdef654321"
                  customer: "68b123456789abcdef111111"
                  items:
                    - name: "Notebook Lenovo"
                      quantity: 2
                      price: 850000
                  deliveryAddress: "Av. Independencia 1234, Mar del Plata"
                  total: 1700000
                  status: created
                  priority: normal
                  createdAt: "2026-09-28T15:00:00.000Z"
                  updatedAt: "2026-09-28T15:00:00.000Z"
        "400":
          description: Datos del pedido invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                customerRequired:
                  summary: Falta el cliente
                  value:
                    status: error
                    error: VALIDATION_ERROR
                    message: El cliente es obligatorio
                itemsRequired:
                  summary: El pedido no tiene productos
                  value:
                    status: error
                    error: ORDER_ITEMS_REQUIRED
                    message: El pedido debe contener al menos un producto
                deliveryAddressRequired:
                  summary: Falta la direccion de entrega
                  value:
                    status: error
                    error: VALIDATION_ERROR
                    message: La direccion de entrega es obligatoria
                invalidTotal:
                  summary: Total invalido
                  value:
                    status: error
                    error: VALIDATION_ERROR
                    message: El total debe ser un numero mayor o igual a 0
                invalidPriority:
                  summary: Prioridad invalida
                  value:
                    status: error
                    error: VALIDATION_ERROR
                    message: La prioridad indicada no es valida
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

  /api/orders/{id}:
    get:
      tags:
        - Orders
      summary: Obtener un pedido por ID
      description: Devuelve un pedido especifico utilizando su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
          example: "68b123456789abcdef654321"
      responses:
        "200":
          description: Pedido obtenido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSuccessResponse"
              example:
                status: success
                payload:
                  _id: "68b123456789abcdef654321"
                  customer:
                    _id: "68b123456789abcdef111111"
                    firstName: "Ivan"
                    lastName: "Sanchez"
                    email: "ivan@example.com"
                    role: customer
                  items:
                    - name: "Notebook Lenovo"
                      quantity: 2
                      price: 850000
                  deliveryAddress: "Av. Independencia 1234, Mar del Plata"
                  total: 1700000
                  status: created
                  priority: normal
                  proof:
                    originalName: "comprobante-entrega.pdf"
                    filename: "uuid-comprobante.pdf"
                    path: "/uploads/proofs/uuid-comprobante.pdf"
                    mimetype: application/pdf
                    size: 245760
                    uploadedAt: "2026-09-28T15:00:00.000Z"
                  createdAt: "2026-09-28T15:00:00.000Z"
                  updatedAt: "2026-09-28T15:00:00.000Z"
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: ORDER_NOT_FOUND
                message: No se encontro el pedido solicitado
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

    delete:
      tags:
        - Orders
      summary: Eliminar un pedido
      description: Elimina un pedido existente utilizando su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
          example: "68b123456789abcdef654321"
      responses:
        "200":
          description: Pedido eliminado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                message: Pedido eliminado correctamente
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: ORDER_NOT_FOUND
                message: No se encontro el pedido solicitado
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

  /api/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Actualizar el estado de un pedido
      description: Actualiza el estado de un pedido existente.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
          example: "68b123456789abcdef654321"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusRequest"
            example:
              status: in_transit
      responses:
        "200":
          description: Estado del pedido actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSuccessResponse"
              example:
                status: success
                message: Estado del pedido actualizado correctamente
                payload:
                  _id: "68b123456789abcdef654321"
                  customer:
                      _id: "68b123456789abcdef111111"
                      firstName: "Ivan"
                      lastName: "Sanchez"
                      email: "ivan@example.com"
                      role: customer
                  items:
                    - name: "Notebook Lenovo"
                      quantity: 2
                      price: 850000
                  deliveryAddress: "Av. Independencia 1234, Mar del Plata"
                  total: 1700000
                  status: in_transit
                  priority: normal
        "400":
          description: Estado del pedido invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INVALID_ORDER_STATUS
                message: El estado indicado no es valido para un pedido
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: ORDER_NOT_FOUND
                message: No se encontro el pedido solicitado
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

  /api/orders/{id}/proof:
    post:
      tags:
        - Orders
      summary: Cargar comprobante de un pedido
      description: Permite adjuntar un comprobante al pedido mediante un archivo PDF, JPEG, PNG o WEBP de hasta 5 MB.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del pedido
          schema:
            type: string
          example: "68b123456789abcdef654321"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - proof
              properties:
                proof:
                  type: string
                  format: binary
                  description: Archivo del comprobante (PDF, JPEG, PNG o WEBP; máximo 5 MB).
      responses:
        "200":
          description: Comprobante cargado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSuccessResponse"
              example:
                status: success
                message: Comprobante cargado correctamente
                payload:
                  _id: "68b123456789abcdef654321"
                  proof:
                    originalName: "comprobante.pdf"
                    filename: "uuid-comprobante.pdf"
                    path: "/uploads/proofs/uuid-comprobante.pdf"
                    mimetype: "application/pdf"
                    size: 125000
                    uploadedAt: "2026-11-10T12:00:00.000Z"
        "400":
          description: Archivo ausente, tipo no permitido o tamaño superior al límite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                fileRequired:
                  summary: No se adjunto un archivo
                  value:
                    status: error
                    error: FILE_REQUIRED
                    message: Debés adjuntar un archivo
                invalidFileType:
                  summary: Tipo de archivo no permitido
                  value:
                    status: error
                    error: INVALID_FILE_TYPE
                    message: El tipo de archivo no está permitido
                fileTooLarge:
                  summary: Archivo superior a 5 MB
                  value:
                    status: error
                    error: FILE_TOO_LARGE
                    message: El archivo supera el tamaño máximo permitido de 5 MB
                invalidFileField:
                  summary: Campo de archivo incorrecto
                  value:
                    status: error
                    error: INVALID_FILE_FIELD
                    message: El campo del archivo no es válido
                uploadError:
                  summary: Error al procesar la carga
                  value:
                    status: error
                    error: UPLOAD_ERROR
                    message: No se pudo procesar la carga del archivo
        "404":
          description: Pedido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: ORDER_NOT_FOUND
                message: No se encontro el pedido solicitado
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor
