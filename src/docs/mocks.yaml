  /api/mocks/seed:
    post:
      tags:
        - Mocks
      summary: Cargar seed completo de datos mock
      description: Genera y persiste un conjunto completo de usuarios, pedidos y entregas manteniendo las relaciones entre las entidades.
      parameters:
        - name: qty
          in: query
          required: false
          description: Cantidad de registros a generar para cada entidad. El valor por defecto es 10 y el maximo permitido es 50.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10

      responses:
        "201":
          description: Datos mock cargados correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Datos mock cargados correctamente
                  quantity:
                    type: object
                    properties:
                      users:
                        type: integer
                        example: 10
                      orders:
                        type: integer
                        example: 10
                      deliveries:
                        type: integer
                        example: 10
              example:
                status: success
                message: Datos mock cargados correctamente
                quantity:
                  users: 10
                  orders: 10
                  deliveries: 10

        "400":
          description: Cantidad de mocks invalida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
