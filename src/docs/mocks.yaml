                  items:
                    type: string
                  example:
                    - "68b123456789abcdef654321"
                    - "68b123456789abcdef654322"
                driverIds:
                  type: array
                  description: IDs de usuarios con rol driver.
                  items:
                    type: string
                  example:
                    - "68b123456789abcdef111111"
                    - "68b123456789abcdef222222"
            example:
              orderIds:
                - "68b123456789abcdef654321"
                - "68b123456789abcdef654322"
              driverIds:
                - "68b123456789abcdef111111"
                - "68b123456789abcdef222222"

      responses:
