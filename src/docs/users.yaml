paths:

  /api/users:
    get:
      tags:
        - Users
      summary: Obtener todos los usuarios
      description: Devuelve todos los usuarios registrados en ShipNow.
      responses:
        "200":
          description: Lista de usuarios obtenida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
              example:
                status: success
                payload:
                  - _id: "68b123456789abcdef111111"
                    firstName: "Ivan"
                    lastName: "Sanchez"
                    email: "ivan@example.com"
                    role: "customer"
                    isAvailable: false
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

    post:
      tags:
        - Users
      summary: Crear un usuario
      description: Crea un nuevo usuario en ShipNow. Si no se informa un rol, se utiliza customer por defecto.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              firstName: "Ivan"
              lastName: "Sanchez"
              email: "ivan@example.com"
              password: "secret123"
              role: "customer"
              isAvailable: false
      responses:
        "201":
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccessResponse"
              example:
                status: success
                message: Usuario creado correctamente
                payload:
                  _id: "68b123456789abcdef111111"
                  firstName: "Ivan"
                  lastName: "Sanchez"
                  email: "ivan@example.com"
                  role: "customer"
                  isAvailable: false
                  createdAt: "2026-09-28T15:00:00.000Z"
                  updatedAt: "2026-09-28T15:00:00.000Z"
        "400":
          description: Datos del usuario invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validationError:
                  summary: Campos obligatorios faltantes
                  value:
                    status: error
                    error: VALIDATION_ERROR
                    message: Los campos firstName, lastName y email son obligatorios
                invalidRole:
                  summary: Rol invalido
                  value:
                    status: error
                    error: INVALID_USER_ROLE
                    message: El rol de usuario no es válido
        "409":
          description: El email ya esta registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: USER_ALREADY_EXISTS
                message: Ya existe un usuario registrado con ese email
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor


  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Obtener un usuario por ID
      description: Devuelve un usuario especifico utilizando su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
          example: "68b123456789abcdef111111"
      responses:
        "200":
          description: Usuario obtenido correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccessResponse"
              example:
                status: success
                payload:
                  _id: "68b123456789abcdef111111"
                  firstName: "Ivan"
                  lastName: "Sanchez"
                  email: "ivan@example.com"
                  role: "customer"
                  isAvailable: false
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: USER_NOT_FOUND
                message: No se encontro el usuario solicitado
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

    put:
      tags:
        - Users
      summary: Actualizar un usuario
      description: Actualiza los datos de un usuario existente utilizando su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
          example: "68b123456789abcdef111111"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
            example:
              firstName: "Ivan"
              lastName: "Sanchez"
              email: "ivan.nuevo@example.com"
              role: "driver"
              isAvailable: true
      responses:
        "200":
          description: Usuario actualizado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSuccessResponse"
              example:
                status: success
                message: Usuario actualizado correctamente
                payload:
                  _id: "68b123456789abcdef111111"
                  firstName: "Ivan"
                  lastName: "Sanchez"
                  email: "ivan.nuevo@example.com"
                  role: "driver"
                  isAvailable: true
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: USER_NOT_FOUND
                message: No se encontro el usuario solicitado
        "400":
          description: Datos del usuario invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRole:
                  summary: Rol invalido
                  value:
                    status: error
                    error: INVALID_USER_ROLE
                    message: El rol de usuario no es válido
        "409":
          description: El email ya esta registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: USER_ALREADY_EXISTS
                message: Ya existe un usuario registrado con ese email
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor

    delete:
      tags:
        - Users
      summary: Eliminar un usuario
      description: Elimina un usuario existente utilizando su ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
          example: "68b123456789abcdef111111"
      responses:
        "200":
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                status: success
                message: Usuario eliminado correctamente
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: USER_NOT_FOUND
                message: No se encontro el usuario solicitado
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: error
                error: INTERNAL_SERVER_ERROR
                message: Ocurrio un error interno del servidor